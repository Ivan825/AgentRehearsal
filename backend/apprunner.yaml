# AWS App Runner config (source-based deploy from the backend/ directory).
version: 1.0
runtime: python312
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn agentrehearsal.api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: AGENTREHEARSAL_RUNS_DIR
      value: /tmp/runs
